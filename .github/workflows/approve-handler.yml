name: approve-handler

# A human org member commenting EXACTLY `/approve` on a PR adds the
# `human-approved` label, which makes the `human-approval-gate` check pass.
# Requirements:
#   - comment body is EXACTLY `/approve` (trimmed)
#   - the commenter is NOT a bot (github-actions bot cannot approve)
#   - the commenter is a repo admin/maintain/write (the deterministic bar for
#     "org member with repo approval authority" achievable with the GITHUB_TOKEN;
#     strict org-membership needs a PAT — see issue #1460).
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  approve:
    if: github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: Add human-approved for an exact human /approve
        uses: actions/github-script@v7
        with:
          script: |
            const body = (context.payload.comment.body || '').trim();
            if (body !== '/approve') {
              console.log('not an exact /approve; ignoring.');
              return;
            }
            const author = context.payload.comment.user.login;
            if (author === 'github-actions[bot]') {
              core.setFailed('Bots cannot /approve.');
              return;
            }
            // Approver bar: repo admin/maintain/write (deterministic with GITHUB_TOKEN).
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: author,
            });
            if (!['admin', 'maintain', 'write'].includes(perm.permission)) {
              console.log(`@${author} is ${perm.permission}; ignoring /approve.`);
              return;
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels: ['human-approved'],
            });
            console.log(`added human-approved to #${context.payload.issue.number} via @${author}`);

            // Push a head commit so the gate re-runs on the head commit. A
            // token-added label doesn't fire `labeled`, and issue_comment runs
            // aren't attached to the head — a synchronize (head commit) is what
            // turns the required `human-approval-gate` check green.
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.issue.number,
            });
            const branch = pr.head.ref;
            const content = Buffer.from(
              `approved by ${author} at ${new Date().toISOString()}\n`,
            ).toString('base64');
            let sha;
            try {
              const { data: existing } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: '.opencode/approved',
                ref: branch,
              });
              sha = existing.sha;
            } catch (e) {
              // 404 -> create the marker.
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: '.opencode/approved',
              message: 'ci: record human approval',
              content,
              branch,
              ...(sha ? { sha } : {}),
            });
            console.log(`pushed approval marker to ${branch}`);
