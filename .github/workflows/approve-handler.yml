name: approve-handler

# A HUMAN repo admin commenting `/approve` on a PR adds the `human-approved`
# label, which makes the `human-approval-gate` check pass (same as an Approved
# review). The github-actions bot is not a repo admin, so it cannot trigger it —
# and the AI agents are forbidden (AGENTS.md + prompt) from posting `/approve`.
on:
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  issues: write

jobs:
  approve:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/approve')
    runs-on: ubuntu-latest
    steps:
      - name: Add human-approved for a human /approve
        uses: actions/github-script@v7
        with:
          script: |
            const author = context.payload.comment.user.login;
            if (author === 'github-actions[bot]') {
              core.setFailed('Bots cannot /approve.');
              return;
            }
            // The approver must be a repo admin/maintain/write (the human bar).
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: author,
            });
            if (!['admin', 'maintain', 'write'].includes(perm.permission)) {
              console.log(`@${author} is ${perm.permission}; ignoring /approve.`);
              return;
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels: ['human-approved'],
            });
            console.log(`added human-approved to #${context.payload.issue.number} via @${author}`);