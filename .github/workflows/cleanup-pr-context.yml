name: Cleanup pr-context

# pr-context.md is ephemeral per-PR working state (read by agents while a PR is
# open). It must never accumulate on main. This workflow removes it from main
# whenever it lands there (a PR merge is a push to main, so this covers merges
# and any direct push). It self-heals: if the file is already gone it no-ops,
# and the cleanup commit itself re-triggers the workflow once, which then finds
# nothing to do and stops.
on:
  push:
    branches: [main]

jobs:
  remove-pr-context:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Check pr-context.md
        id: check
        run: |
          if [ -f pr-context.md ]; then
            echo "needs_cleanup=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_cleanup=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete pr-context.md
        if: steps.check.outputs.needs_cleanup == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm pr-context.md
          git commit -m "ci: remove pr-context.md (ephemeral per-PR working state)"
          git push origin main
