name: DB change guard

# Prevents merging PRs that touch the data model without explicit human
# approval. A PR that modifies DB-impactful files (migrations, database types,
# edge-function queries/RLS, or any .sql) FAILS this required check until a
# human adds the `db-approved` label after reviewing the migration.
#
# NOTE: make this a REQUIRED status check in branch protection for it to
# hard-block merges (main currently has no branch protection).
on:
  pull_request:
    types: [opened, synchronize, labeled, unlabeled, ready_for_review, reopened]

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Detect DB impact + approval
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });
            const dbPattern = /^(supabase\/migrations\/|frontend\/src\/types\/database\.types\.ts|supabase\/functions\/)/;
            const dbFiles = files
              .map((f) => f.filename)
              .filter((p) => dbPattern.test(p) || p.endsWith('.sql'));
            const dbImpact = dbFiles.length > 0;
            const approved = pr.labels.some((l) => l.name === 'db-approved');
            core.setOutput('dbImpact', String(dbImpact));
            core.setOutput('approved', String(approved));
            core.setOutput('dbFiles', dbFiles.join('\n'));

      - name: Remind human review needed
        if: steps.check.outputs.dbImpact == 'true' && steps.check.outputs.approved == 'false'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          DB_FILES: ${{ steps.check.outputs.dbFiles }}
        with:
          script: |
            // Idempotent: updates the existing guard comment instead of spamming.
            const marker = '<!-- db-change-guard -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            const body =
              `${marker}\n\n⚠️ **DB change guard**: this PR modifies the data model and is not yet approved.\n\n` +
              `Changed DB files:\n\`\`\`\n${process.env.DB_FILES || ''}\n\`\`\`\n\n` +
              `A human must review the migration (risk classification + rollback, see ` +
              `docs/db-change-checklist.md) and add the **\`db-approved\`** label ` +
              `before merging. This PR fails the DB change guard check until then.`;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if DB change not approved
        if: steps.check.outputs.dbImpact == 'true' && steps.check.outputs.approved == 'false'
        run: |
          echo "::error::DB-impactful changes present but missing 'db-approved' label. A human must review the migration and add the label (see docs/db-change-checklist.md)."
          echo "Changed DB files:"
          echo "${{ steps.check.outputs.dbFiles }}"
          exit 1