name: human-approval-gate

# Human approval gate (single required check that folds the former DB change
# guard into it).
#
# A PR FAILS until it has an "Approved" review from a human repo admin
# (admin/maintain/write) when EITHER:
#   - it is labeled `generated` (AI-created), OR
#   - it changes DB-impactful paths (migrations, database.types.ts,
#     supabase/functions/, or any .sql).
# The github-actions bot is not a repo admin, so it cannot forge the approval —
# this is a deterministic human gate. Human, non-DB PRs pass trivially.
#
# NOTE: add this workflow as a REQUIRED status check (named `human-approval-gate`)
# in the `main` branch protection rule for it to hard-block merges.
on:
  pull_request:
    types: [opened, synchronize, labeled, unlabeled, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  human-approval-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce human approval for generated / DB-change PRs
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const labels = (pr.labels || []).map((l) => l.name);
            const isGenerated = labels.includes('generated');

            // A human-approved PR (via Approved review OR a human `/approve`
            // comment that added the `human-approved` label) passes.
            if (labels.includes('human-approved')) {
              console.log('human-approved label present; passing.');
              return;
            }

            const dbPattern = /^(supabase\/migrations\/|frontend\/src\/types\/database\.types\.ts|supabase\/functions\/)/;
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });
            const isDbChange = files.some(
              (f) => dbPattern.test(f.filename) || f.filename.endsWith('.sql'),
            );

            if (!isGenerated && !isDbChange) {
              console.log('Human PR without DB impact; passing.');
              return;
            }

            const reason = isGenerated && isDbChange
              ? 'generated + DB-impactful'
              : isGenerated ? 'generated' : 'DB-impactful';
            console.log(`Gate applies: ${reason} PR. Requiring human Approved review.`);

            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });
            const approvers = reviews
              .filter((r) => r.state === 'APPROVED')
              .map((r) => r.user.login);
            if (approvers.length === 0) {
              core.setFailed(`${reason} PR requires a human Approved review before merge.`);
              return;
            }
            for (const login of approvers) {
              try {
                const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  username: login,
                });
                if (['admin', 'maintain', 'write'].includes(data.permission)) {
                  console.log(`Approved by ${login} (${data.permission}); passing.`);
                  return;
                }
              } catch (e) {
                // Not a repo collaborator; ignore this approver.
              }
            }
            core.setFailed(
              `${reason} PR requires an Approved review from a human repo admin (admin/maintain/write).`,
            );