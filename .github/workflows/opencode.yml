name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check org membership
        id: check
        uses: actions/github-script@v7
        env:
          # PAT with `read:org` scope. The GITHUB_TOKEN cannot check org
          # membership (no permission key grants read:org), so use a dedicated
          # token. Missing secret => check fails closed (treated as non-member).
          ORG_MEMBERSHIP_TOKEN: ${{ secrets.ORG_MEMBERSHIP_TOKEN }}
        with:
          script: |
            const username = context.payload.comment.user.login;
            if (!process.env.ORG_MEMBERSHIP_TOKEN) {
              console.log('ORG_MEMBERSHIP_TOKEN secret not set; treating as non-member');
              core.setOutput('is_member', 'false');
            } else {
              // `github` in the script context is already an Octokit instance
              // (no getOctokit method in github-script@v7), so build a second
              // client for the PAT via the @actions/github factory.
              const { getOctokit } = require('@actions/github');
              const octokit = getOctokit(process.env.ORG_MEMBERSHIP_TOKEN);
              try {
                await octokit.rest.orgs.checkMembershipForUser({
                  org: 'ankaboot-source',
                  username,
                });
                core.setOutput('is_member', 'true');
              } catch (e) {
                core.setOutput('is_member', 'false');
              }
            }

      - name: Run opencode
        if: steps.check.outputs.is_member == 'true'
        uses: anomalyco/opencode/github@latest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          model: openrouter/deepseek/deepseek-v4-flash
          use_github_token: true
          prompt: |
            You are the WikiAdviser coding agent. A user left a comment containing /oc on this issue or PR. Read the full comment and execute the requested task (explain, fix, implement, review, or merge).

            Follow AGENTS.md for build/test/lint commands and conventions, and run the relevant checks before finishing.

            After making your changes:
            - If you changed UI, write the list of affected routes (URL paths) to `.opencode/screens.txt`, one per line, so the screenshot step can capture them.
            - Post a concise reply comment back to the issue/PR summarizing what you did.

      - name: Notify non-member
        if: steps.check.outputs.is_member != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Only members of the ankaboot-source org can use /oc on this repo.',
            });

      - name: Setup pnpm
        if: steps.check.outputs.is_member == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        if: steps.check.outputs.is_member == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        if: steps.check.outputs.is_member == 'true'
        run: cd frontend && pnpm install

      - name: Capture UI screenshots
        if: steps.check.outputs.is_member == 'true'
        run: bash scripts/screenshots.sh
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload screenshots
        if: steps.check.outputs.is_member == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Post screenshots comment
        if: steps.check.outputs.is_member == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = 'screenshots';
            if (!fs.existsSync(dir)) {
              console.log('No screenshots dir; skipping comment');
              return;
            }
            const files = [];
            const walk = (d) => {
              for (const e of fs.readdirSync(d, { withFileTypes: true })) {
                const p = path.join(d, e.name);
                if (e.isDirectory()) walk(p);
                else files.push(p);
              }
            };
            walk(dir);
            if (files.length === 0) {
              console.log('No screenshot files; skipping comment');
              return;
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## 🤖 UI screenshots',
              '',
              `Captured ${files.length} screenshot(s) of the affected routes at desktop (1280px) and mobile (390px) widths.`,
              '',
              `Download the **ui-screenshots** artifact from [this run](${runUrl}) to view them.`,
              '',
              'Files:',
              ...files.map((f) => `- \`${f}\``),
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
