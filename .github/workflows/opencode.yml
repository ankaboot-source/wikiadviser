name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          model: openrouter/deepseek/deepseek-v4-flash
          use_github_token: true
          prompt: |
            You are the WikiAdviser coding agent. A user left a comment containing /oc on this issue or PR. Read the full comment and execute the requested task (explain, fix, implement, review, or merge).

            Follow AGENTS.md for build/test/lint commands and conventions, and run the relevant checks before finishing.

            After making your changes:
            - If you changed UI, write the list of affected routes (URL paths) to `.opencode/screens.txt`, one per line, so the screenshot step can capture them.
            - Post a concise reply comment back to the issue/PR summarizing what you did.

      - name: Setup pnpm
        if: always()
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        if: always()
        run: cd frontend && pnpm install

      - name: Capture UI screenshots
        if: always()
        run: bash scripts/screenshots.sh
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Post screenshots comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = 'screenshots';
            if (!fs.existsSync(dir)) {
              console.log('No screenshots dir; skipping comment');
              return;
            }
            const files = [];
            const walk = (d) => {
              for (const e of fs.readdirSync(d, { withFileTypes: true })) {
                const p = path.join(d, e.name);
                if (e.isDirectory()) walk(p);
                else files.push(p);
              }
            };
            walk(dir);
            if (files.length === 0) {
              console.log('No screenshot files; skipping comment');
              return;
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## 🤖 UI screenshots',
              '',
              `Captured ${files.length} screenshot(s) of the affected routes at desktop (1280px) and mobile (390px) widths.`,
              '',
              `Download the **ui-screenshots** artifact from [this run](${runUrl}) to view them.`,
              '',
              'Files:',
              ...files.map((f) => `- \`${f}\``),
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
