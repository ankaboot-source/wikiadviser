version: "3.1"

# Edge + separate prod/QA frontend caddies so each env can be deployed independently.
# Network isolation (Option B):
#   - All three join the private bridge network `wikiadviser-net`.
#   - Only `wikiadviser-edge` publishes host ports (80/443 = TLS/ACME + reverse proxy).
#   - `wikiadviser-frontend-prod/qa` expose NO host interfaces; they are reachable only
#     from the edge (by container name) on the internal network.
#   - Backends reach the mediawiki Apache on the host's PRIVATE IP (10.114.0.8:808x),
#     which Apache already binds (see docker/conf/ports.conf).
# Generic var names are resolved from the --env-file passed at deploy time:
#   prod uses .env.prod, qa uses .env.qa (each carries that env's values + the edge
#   endpoint vars). Only the deployed service is built/started in each workflow.

services:
  wikiadviser-edge:
    image: caddy:2.11.7-alpine
    container_name: wikiadviser-edge
    ports:
      - "80:80"
      - "443:443"
    networks:
      - wikiadviser-net
    volumes:
      - caddy-data:/data
      - ./Caddyfile.edge:/etc/caddy/Caddyfile:ro
      - /var/log/caddy/:/var/log/caddy/
    environment:
      - WIKIADVISER_FRONTEND_ENDPOINT_PROD=${WIKIADVISER_FRONTEND_ENDPOINT_PROD}
      - WIKIADVISER_FRONTEND_ENDPOINT_QA=${WIKIADVISER_FRONTEND_ENDPOINT_QA}
      - MEDIAWIKI_DEV_ENDPOINT=${MEDIAWIKI_DEV_ENDPOINT}

  wikiadviser-frontend-prod:
    image: wikiadviser-frontend-prod:git
    container_name: wikiadviser-frontend-prod
    networks:
      - wikiadviser-net
    volumes:
      - ./Caddyfile.frontend-prod:/etc/caddy/Caddyfile:ro
      - ./robots.txt:/etc/caddy/robots.txt:ro
      - /var/log/caddy/:/var/log/caddy/
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        SUPABASE_PROJECT_URL: ${SUPABASE_PROJECT_URL}
        SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
        MEDIAWIKI_ENDPOINT: ${MEDIAWIKI_ENDPOINT}
        WIKIADVISER_LANGUAGES: ${WIKIADVISER_LANGUAGES}
        SHARE_LINK_DAY_LIMIT: ${SHARE_LINK_DAY_LIMIT}
        SENTRY_DSN_FRONTEND: ${SENTRY_DSN_FRONTEND}
        SENTRY_ENV_FRONTEND: ${SENTRY_ENV_FRONTEND}
        POSTHOG_API_KEY: ${POSTHOG_API_KEY}
        POSTHOG_API_HOST: ${POSTHOG_API_HOST}
        USE_MIRA: ${USE_MIRA}
        USE_CHANGE_DESCRIPTION: ${USE_CHANGE_DESCRIPTION}
    environment:
      - SUPABASE_PROJECT_URL=${SUPABASE_PROJECT_URL}
      - X_API_KEY=${X_API_KEY}

  wikiadviser-frontend-qa:
    image: wikiadviser-frontend-qa:git
    container_name: wikiadviser-frontend-qa
    networks:
      - wikiadviser-net
    volumes:
      - ./Caddyfile.frontend-qa:/etc/caddy/Caddyfile:ro
      - ./robots.txt:/etc/caddy/robots.txt:ro
      - /var/log/caddy/:/var/log/caddy/
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        SUPABASE_PROJECT_URL: ${SUPABASE_PROJECT_URL}
        SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
        MEDIAWIKI_ENDPOINT: ${MEDIAWIKI_ENDPOINT}
        WIKIADVISER_LANGUAGES: ${WIKIADVISER_LANGUAGES}
        SHARE_LINK_DAY_LIMIT: ${SHARE_LINK_DAY_LIMIT}
        SENTRY_DSN_FRONTEND: ${SENTRY_DSN_FRONTEND}
        SENTRY_ENV_FRONTEND: ${SENTRY_ENV_FRONTEND}
        POSTHOG_API_KEY: ${POSTHOG_API_KEY}
        POSTHOG_API_HOST: ${POSTHOG_API_HOST}
        USE_MIRA: ${USE_MIRA}
        USE_CHANGE_DESCRIPTION: ${USE_CHANGE_DESCRIPTION}
    environment:
      - SUPABASE_PROJECT_URL=${SUPABASE_PROJECT_URL}
      - X_API_KEY=${X_API_KEY}

networks:
  wikiadviser-net:
    driver: bridge

volumes:
  caddy-data: