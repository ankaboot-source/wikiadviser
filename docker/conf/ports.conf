# The frontend caddy containers run on a private docker network (wikiadviser-net)
# and reach the mediawiki Apache via the host's PRIVATE IP (e.g. 10.114.0.8).
# Apache must therefore listen on the loopback AND the private IP (NOT 0.0.0.0,
# which would expose mediawiki on the public interface). Do not bind 0.0.0.0 in
# production — use the reverse-proxy edge (caddy) for public access.
Listen 127.0.0.1:${MW_PORT}
Listen 10.114.0.8:${MW_PORT}